<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privacy Overlay Web Portal</title>
    <style>
        body {
            background-color: #1e1e1e;
            color: #d4d4d4;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        
        .header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            gap: 15px;
        }

        h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 600;
        }

        input, button, textarea {
            background-color: #2d2d2d;
            border: 1px solid #404040;
            color: #d4d4d4;
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 14px;
            outline: none;
        }

        input:focus, textarea:focus {
            border-color: #007acc;
        }

        button {
            background-color: #007acc;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #0098ff;
        }

        textarea {
            flex-grow: 1;
            resize: none;
            font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
            line-height: 1.5;
            display: none;
        }

        #status {
            font-size: 12px;
            color: #858585;
            margin-left: auto;
        }

        .connected { color: #89d185 !important; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Privacy Overlay Sync</h1>
        <input type="text" id="roomCodeInput" placeholder="Enter 4-digit Room Code" maxlength="4">
        <button id="connectBtn">Connect</button>
        <div id="status">Not Connected</div>
    </div>

    <textarea id="editor" placeholder="Start typing... Everything will sync instantly to the Mac app."></textarea>

    <!-- Firebase SDKs (Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

        // Configuration provided by user
        const firebaseConfig = {
            apiKey: "AIzaSyCN8UGWWWcHLEE4KpnsFTAhqBo5ti2IPSM",
            authDomain: "privacy-overlay-4cf1f.firebaseapp.com",
            projectId: "privacy-overlay-4cf1f",
            storageBucket: "privacy-overlay-4cf1f.firebasestorage.app",
            messagingSenderId: "68702314935",
            appId: "1:68702314935:web:3b1cf2417a63e134474832"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const roomInput = document.getElementById('roomCodeInput');
        const connectBtn = document.getElementById('connectBtn');
        const statusEl = document.getElementById('status');
        const editor = document.getElementById('editor');

        let unsubscribe = null;
        let currentRoom = null;
        let isExternalUpdate = false;

        connectBtn.addEventListener('click', async () => {
            const code = roomInput.value.trim();
            if (code.length !== 4) {
                alert("Please enter a 4-digit room code.");
                return;
            }

            if (unsubscribe) unsubscribe();

            currentRoom = code;
            statusEl.textContent = "Authenticating...";
            statusEl.className = "";

            try {
                await signInAnonymously(auth);
            } catch (error) {
                console.error("Auth Error:", error);
                statusEl.textContent = "Auth Failed.";
                return;
            }

            statusEl.textContent = "Connecting...";

            const roomRef = doc(db, "rooms", currentRoom);
            
            unsubscribe = onSnapshot(roomRef, (docSnapshot) => {
                if (docSnapshot.exists()) {
                    const data = docSnapshot.data();
                    statusEl.textContent = `Connected to Room ${currentRoom}`;
                    statusEl.className = "connected";
                    editor.style.display = "block";
                    
                    if (editor.value !== data.text) {
                        isExternalUpdate = true;
                        
                        // Save cursor position
                        const start = editor.selectionStart;
                        const end = editor.selectionEnd;
                        
                        editor.value = data.text || "";
                        
                        // Restore cursor position
                        editor.setSelectionRange(start, end);
                        
                        isExternalUpdate = false;
                    }
                } else {
                    statusEl.textContent = "Waiting for Mac App to sync...";
                    statusEl.className = "";
                    editor.style.display = "none";
                }
            });
        });

        editor.addEventListener('input', () => {
            if (!currentRoom || isExternalUpdate) return;
            
            const roomRef = doc(db, "rooms", currentRoom);
            setDoc(roomRef, {
                text: editor.value,
                timestamp: Date.now() / 1000
            });
        });
    </script>
</body>
</html>
